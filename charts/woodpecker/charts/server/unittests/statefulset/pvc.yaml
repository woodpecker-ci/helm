suite: test deployment
templates:
  - templates/statefulset.yaml
tests:
  - it: persistentVolume enabled
    set:
      persistentVolume:
        enabled: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOnce'
  - it: persistentVolume enabled with one accessModes
    set:
      persistentVolume:
        enabled: true
        accessModes:
          - 'ReadWriteOncePod'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOncePod'
  - it: persistentVolume enabled with two accessModes
    set:
      persistentVolume:
        enabled: true
        accessModes:
          - 'ReadWriteOncePod'
          - 'ReadWriteMany'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOncePod'
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[1]
          value: 'ReadWriteMany'
  - it: persistentVolume enabled with one label
    set:
      persistentVolume:
        enabled: true
        labels:
          label0: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
  - it: persistentVolume enabled with two labels
    set:
      persistentVolume:
        enabled: true
        labels:
          label0: 'value'
          label1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
            label1: 'value'
  - it: persistentVolume enabled with one annotation
    set:
      persistentVolume:
        enabled: true
        annotations:
          annotation0: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
  - it: persistentVolume enabled with two annotations
    set:
      persistentVolume:
        enabled: true
        annotations:
          annotation0: 'value'
          annotation1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
            annotation1: 'value'
  - it: persistentVolume enabled with default labels and annotations omits both keys
    set:
      persistentVolume:
        enabled: true
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.annotations
  - it: persistentVolume enabled with labels and annotations together
    set:
      persistentVolume:
        enabled: true
        labels:
          label0: 'value'
          label1: 'value'
        annotations:
          annotation0: 'value'
          annotation1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
            label1: 'value'
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
            annotation1: 'value'
