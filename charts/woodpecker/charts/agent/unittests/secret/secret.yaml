suite: test agent secret
templates:
  - secret.yml
tests:
  - it: should not create secrets by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one document per secret
    set:
      secrets:
        - name: first
          data:
            FIRST: 'one'
        - name: second
          data:
            SECOND: 'two'
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: first
        documentIndex: 0
      - equal:
          path: data.FIRST
          value: b25l
        documentIndex: 0
      - equal:
          path: metadata.name
          value: second
        documentIndex: 1
      - equal:
          path: data.SECOND
          value: dHdv
        documentIndex: 1
