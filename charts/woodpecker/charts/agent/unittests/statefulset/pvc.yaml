suite: test deployment
templates:
  - templates/statefulset.yaml
tests:
  - it: persistence enabled
    set:
      persistence:
        enabled: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOnce'
  - it: persistence enabled with one accessModes
    set:
      persistence:
        enabled: true
        accessModes:
          - 'ReadWriteOncePod'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOncePod'
  - it: persistence enabled with two accessModes
    set:
      persistence:
        enabled: true
        accessModes:
          - 'ReadWriteOncePod'
          - 'ReadWriteMany'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: 'ReadWriteOncePod'
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[1]
          value: 'ReadWriteMany'
  - it: persistence enabled with one label
    set:
      persistence:
        enabled: true
        labels:
          label0: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
  - it: persistence enabled with two labels
    set:
      persistence:
        enabled: true
        labels:
          label0: 'value'
          label1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
            label1: 'value'
  - it: persistence enabled with one annotation
    set:
      persistence:
        enabled: true
        annotations:
          annotation0: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
  - it: persistence enabled with two annotations
    set:
      persistence:
        enabled: true
        annotations:
          annotation0: 'value'
          annotation1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
            annotation1: 'value'
  - it: persistence enabled with existingClaim
    set:
      persistence:
        enabled: true
        existingClaim: 'my-claim'
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: agent-config
              persistentVolumeClaim:
                claimName: my-claim
  - it: persistence disabled
    set:
      persistence:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - mountPath: /data
              name: data
      - notExists:
          path: spec.volumeClaimTemplates
  - it: persistence enabled with default labels and annotations omits both keys
    set:
      persistence:
        enabled: true
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.annotations
  - it: persistence enabled with labels and annotations together
    set:
      persistence:
        enabled: true
        labels:
          label0: 'value'
          label1: 'value'
        annotations:
          annotation0: 'value'
          annotation1: 'value'
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            label0: 'value'
            label1: 'value'
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations
          value:
            annotation0: 'value'
            annotation1: 'value'
